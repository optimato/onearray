[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "onearray"
dynamic = ["version"]
description = "Backend-agnostic array utilities for NumPy and PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
torch = ["torch>=2"]
test = ["numpy>=1.23", "pytest>=8"]
lint = ["black==26.10.0", "ruff==0.16.10"]
docs = ["zensical>=0.0.66,<0.1", "mkdocstrings-python>=2,<3"]

[project.urls]
Documentation = "https://optimato.github.io/onearray/"
Repository = "https://github.com/optimato/onearray"
Issues = "https://github.com/optimato/onearray/issues"
Changelog = "https://github.com/optimato/onearray/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
