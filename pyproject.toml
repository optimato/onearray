[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "onearray"
dynamic = ["version"]
description = "Backend-agnostic array utilities for NumPy and PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
torch = ["torch>=2"]
test = ["numpy>=1.23", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
