name: Publish Python package

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --editable ".[lint]"
      - run: python -m ruff check src tests
      - run: python -m black --check src tests

  pytest:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable ".[test]"
      - run: python -m pytest

  pytest-torch:
    name: Tests (PyTorch)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            dependencies: '"numpy==1.23.0" "torch==2.0.0"'
          - python: "3.12"
            dependencies: 'numpy torch'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ${{ matrix.dependencies }}
      - run: python -m pip install --editable ".[test,torch]"
      - run: python -m pytest

  build:
    name: Build distribution
    needs: [lint, pytest, pytest-torch]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SemVer release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          pattern = re.compile(
              r"^v(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?"
              r"$"
          )
          if pattern.fullmatch(tag) is None:
              raise SystemExit(
                  f"Release tag {tag!r} is not a PyPI-compatible SemVer 2.0.0 tag"
              )
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distribution
        env:
          SETUPTOOLS_SCM_OVERRIDES_FOR_ONEARRAY: >-
            {local_scheme = "no-local-version-strict"}
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Check PyPI version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email.parser
          import glob
          import os
          import zipfile

          from packaging.version import Version

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              metadata_path, = [
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              ]
              metadata = email.parser.Parser().parsestr(
                  archive.read(metadata_path).decode("utf-8")
              )

          expected = str(Version(os.environ["RELEASE_TAG"].removeprefix("v")))
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"Built distribution version {actual!r} does not match normalized tag {expected!r}"
              )
          print(f"Verified release version: {actual}")
          PY

      - name: Test installed wheel outside the checkout
        run: |
          python -m pip install dist/*.whl numpy pytest torch
          cp -r tests "$RUNNER_TEMP/onearray-tests"
          cd "$RUNNER_TEMP"
          python -m pytest -c /dev/null onearray-tests

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/onearray

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/onearray

    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
