name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --editable ".[test]"
      - run: python -m pytest

  pytest-torch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            dependencies: '"numpy==1.23.0" "torch==2.0.0"'
          - python: "3.12"
            dependencies: 'numpy torch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ${{ matrix.dependencies }}
      - run: python -m pip install --editable ".[test,torch]"
      - run: python -m pytest
